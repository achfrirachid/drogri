<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1e2a4a">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>دروݣري محمد</title>
<style>
:root{--bg:#eef1f5;--card:#fff;--tx:#17213a;--mut:#667089;--ink:#1e2a4a;--tag:#f2b705;--tagtx:#2b2100;--red:#d62828;--org:#e07a00;--grn:#2a9d54;--bd:#dde2ea;--soft:#f6f8fb}
@media(prefers-color-scheme:dark){:root{--bg:#0f1526;--card:#182037;--tx:#e9edf7;--mut:#99a4c0;--ink:#0b1020;--bd:#28324f;--soft:#1e2742;--red:#ff6b6b;--org:#ffa94d;--grn:#51cf86}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font-family:"Noto Naskh Arabic","Segoe UI",Tahoma,system-ui,sans-serif;font-size:16px;line-height:1.5;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
header{background:var(--ink);color:#fff;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 14px;position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:10px}
header h1{font-size:19px;margin:0;font-weight:700}
header small{display:block;opacity:.75;font-size:12.5px;direction:ltr;text-align:right}
header .tag{background:var(--tag);color:var(--tagtx);border-radius:6px;padding:3px 10px;font-weight:700;font-size:13px}
main{padding:14px 14px 20px;max-width:720px;margin:0 auto}
h2{font-size:16px;margin:18px 2px 8px;color:var(--mut);font-weight:700}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px}
.stat small{color:var(--mut);display:block;font-size:13px}
.stat b{font-size:19px}
.red{color:var(--red)}.grn{color:var(--grn)}.org{color:var(--org)}
.item{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:8px;cursor:pointer}
.item:active{background:var(--soft)}
.item b{display:block}
.item small{color:var(--mut);font-size:13.5px}
.badge{background:var(--tag);color:var(--tagtx);font-weight:700;border-radius:6px 14px 14px 6px;padding:4px 12px;white-space:nowrap;font-size:15px;direction:ltr;flex-shrink:0}
.badge.red{background:var(--red);color:#fff}.badge.org{background:var(--org);color:#fff}.badge.grn{background:var(--grn);color:#fff}
.alert{border-inline-start:5px solid var(--org);border-radius:12px;background:var(--card);border-top:1px solid var(--bd);border-bottom:1px solid var(--bd);border-inline-end:1px solid var(--bd);padding:10px 12px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:8px;cursor:pointer}
.alert.r{border-inline-start-color:var(--red)}.alert.g{border-inline-start-color:var(--grn)}
.alert small{color:var(--mut);display:block;font-size:13.5px}
.empty{color:var(--mut);text-align:center;padding:18px 8px}
.btn{border:0;border-radius:10px;padding:12px 14px;font:inherit;font-weight:700;background:var(--ink);color:#fff;cursor:pointer}
.btn.sec{background:var(--soft);color:var(--tx);border:1px solid var(--bd)}
.btn.y{background:var(--tag);color:var(--tagtx)}
.btn.rd{background:var(--red);color:#fff}
.btn.grnb{background:var(--grn);color:#fff}
.btn.sm{padding:8px 12px;font-size:14px}
.btn.big{width:100%;margin-top:12px;font-size:17px;padding:14px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
input,select,textarea{width:100%;font:inherit;font-size:16px;padding:11px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx)}
label{display:block;font-size:14px;color:var(--mut);margin:10px 2px 4px}
.rowf{display:flex;gap:8px}.rowf>*{flex:1}.rowf>button{flex:none}
.chips{display:flex;gap:8px;overflow-x:auto;padding:8px 0;scrollbar-width:none}
.chip{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:20px;padding:6px 14px;white-space:nowrap;font:inherit;font-size:14px;cursor:pointer}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--bd);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom,0px);z-index:30}
.nav button{background:none;border:0;padding:8px 2px 7px;font:inherit;font-size:12.5px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:1px;position:relative;cursor:pointer}
.nav button span{font-size:21px;line-height:1.2}
.nav button.on{color:var(--tx);font-weight:700}
.nav button.on::before{content:"";position:absolute;top:0;width:34px;height:4px;border-radius:0 0 4px 4px;background:var(--tag)}
.nav i{position:absolute;top:4px;inset-inline-end:calc(50% - 24px);background:var(--red);color:#fff;font-style:normal;font-size:11px;min-width:18px;height:18px;border-radius:9px;display:none;align-items:center;justify-content:center;padding:0 4px}
#fab{position:fixed;left:16px;bottom:calc(88px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:16px;background:var(--tag);color:var(--tagtx);border:0;font-size:30px;font-weight:700;display:none;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(0,0,0,.28);z-index:25;cursor:pointer}
.back{position:fixed;inset:0;background:rgba(8,12,24,.55);z-index:50;display:none;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:720px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 14px calc(20px + env(safe-area-inset-bottom,0px))}
.sheet h3{margin:0 0 4px;font-size:19px}
.big-n{font-size:34px;font-weight:700;line-height:1.2}
.line{display:grid;grid-template-columns:1fr auto 78px 30px;gap:6px;align-items:center;padding:8px 0;border-bottom:1px solid var(--bd)}
.line small{color:var(--mut);display:block;font-size:12.5px}
.qty{display:flex;align-items:center;gap:3px}
.qty input{width:56px;text-align:center;padding:8px 2px}
.qty button{width:32px;height:36px;border:1px solid var(--bd);background:var(--soft);color:var(--tx);border-radius:8px;font-size:18px;cursor:pointer}
.line .pr{padding:8px 6px;text-align:center}
.x{border:0;background:none;color:var(--red);font-size:18px;cursor:pointer}
.tot{display:flex;justify-content:space-between;font-size:19px;padding:12px 2px 0}
.hist{padding:9px 0;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;gap:10px}
.hist small{color:var(--mut);display:block;font-size:12.5px}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:12px;z-index:90;max-width:88%;text-align:center;display:none;border:1px solid var(--tag)}
.note{font-size:13.5px;color:var(--mut);background:var(--soft);border:1px solid var(--bd);border-radius:10px;padding:9px 11px;margin:8px 0}
.card,.stat,.item,.alert{box-shadow:0 2px 10px rgba(20,30,60,.07)}
h2::before{content:"🌹 "}
input:focus,select:focus,textarea:focus{border-color:var(--tag);box-shadow:0 0 0 3px rgba(242,183,5,.18)}
.btn{border-radius:12px}
.stat{border-radius:14px}
.card{border-radius:14px}
@media(prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.5}to{transform:none;opacity:1}}}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--tag);outline-offset:1px}
.lock{position:fixed;inset:0;background:var(--bg);z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.lock .box{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:22px 18px;max-width:360px;width:100%;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.15)}
.lock .big{font-size:46px;line-height:1}
.lock h2{color:var(--tx);font-size:20px;margin:8px 0 2px}
.lock p{color:var(--mut);font-size:14px;margin:0 0 12px}
.lock label{text-align:right}
.micbtn{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;width:48px;flex:none;font-size:20px;cursor:pointer}
@keyframes blink{0%,100%{background:var(--card)}50%{background:var(--tag);box-shadow:0 0 16px rgba(242,183,5,.9)}}
.blink{animation:blink .75s 8}
/* 🎨 الألوان */
header{background:linear-gradient(135deg,#16213e 0%,#1e3a8a 55%,#3b5bdb 100%);box-shadow:0 2px 14px rgba(20,40,90,.4)}
.btn{background:linear-gradient(135deg,#1e3a8a,#3b5bdb)}
.stat{border-top:4px solid var(--tag)}
.grid2 .stat:nth-child(2){border-top-color:#51cf86}
.grid2 .stat:nth-child(3){border-top-color:#ff922b}
.grid2 .stat:nth-child(4){border-top-color:#e64980}
.grid2 .stat:nth-child(5){border-top-color:#9775fa}
.grid2 .stat:nth-child(6){border-top-color:#22b8cf}
.grid2 .stat:nth-child(7){border-top-color:#f783ac}
.grid2 .stat:nth-child(8){border-top-color:#20c997}
h2{color:#b8860b;text-shadow:0 1px 2px rgba(184,134,11,.15)}
.lock .box{border:2px solid #f2b705;box-shadow:0 12px 44px rgba(30,58,138,.28)}
.lock h2{color:#1e3a8a}
.toast{background:linear-gradient(135deg,#16213e,#1e3a8a)}
.chip.on{background:linear-gradient(135deg,#1e3a8a,#3b5bdb);border-color:transparent}
.badge{background:linear-gradient(135deg,#f2b705,#ffd43b)}
.badge.red{background:linear-gradient(135deg,#c92a2a,#ff6b6b)}
.badge.grn{background:linear-gradient(135deg,#2b9348,#51cf86)}
.badge.org{background:linear-gradient(135deg,#d9480f,#ff922b)}
.nav button.on{color:#1e3a8a}
.bell{background:none;border:0;font-size:22px;position:relative;color:#fff;padding:2px 6px;cursor:pointer;line-height:1}
.bell i{position:absolute;top:0;inset-inline-end:2px;width:11px;height:11px;border-radius:50%;background:#ff3b3b;display:none;font-size:0}
.bell.on i{display:block;animation:pulse 1s infinite}
@keyframes pulse{0%{opacity:1;box-shadow:0 0 0 0 rgba(255,59,59,.7)}70%{opacity:.35;box-shadow:0 0 0 8px rgba(255,59,59,0)}100%{opacity:1;box-shadow:0 0 0 0 rgba(255,59,59,0)}}
</style>
</head>
<body>
<header><div><h1 id="hname">دروݣري محمد</h1><small id="hphone"></small></div><span class="tag" id="hdate"></span><button class="bell" id="bell" onclick="openMsgs()" aria-label="الرسائل">🔔<i id="b-msg"></i></button><span style="font-size:15px">❤️🌹</span></header>
<main id="view"></main>
<button id="fab" aria-label="إضافة">+</button>
<nav class="nav">
  <button data-t="home"><span>🏠</span>الرئيسية<i id="b-home"></i></button>
  <button data-t="prod"><span>📦</span>السلع<i id="b-prod"></i></button>
  <button data-t="sell"><span>🧾</span>بيع</button>
  <button data-t="debt"><span>📒</span>الديون<i id="b-debt"></i></button>
  <button data-t="more"><span>⚙️</span>المزيد</button>
</nav>
<div class="back" id="back"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
'use strict';
/* ============ البيانات ============ */
const KEY = 'drog_v1';
const $ = s => document.querySelector(s);
let S = load();
function load() {
  try { const d = JSON.parse(localStorage.getItem(KEY)); if (d && d.products) { d.sales = d.sales || []; d.moves = d.moves || []; d.custs = d.custs || []; d.notified = d.notified || {}; d.msgs = d.msgs || []; d.shop = d.shop || {}; return d; } } catch (e) {}
  return { shop: { name: 'دروݣري محمد', phone: '0668-436479' }, products: [], moves: [], sales: [], custs: [], notified: {} };
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { toast('⚠️ الذاكرة عامرة، دير نسخة احتياطية'); } autoSaveAll(); cloudSoon(); }
let backupTimer = null;
function autoSaveAll() { clearTimeout(backupTimer); backupTimer = setTimeout(doBackup, 3000); }
const BK_TARGETS = [['DOCUMENTS', 'drogueri', 'Documents'], ['EXTERNAL_STORAGE', 'Download/drogueri', 'Download'], ['EXTERNAL', 'drogueri', 'ذاكرة التطبيق (SD)']];
let bkAsked = false;
const isEmptyData = () => !S.products.length && !S.custs.length && !S.sales.length;
function bkStatus() {
  let last = null; try { last = JSON.parse(localStorage.getItem('drog_bk') || 'null'); } catch (e) {}
  return last ? 'آخر حفظ تلقائي: <b>' + fd(last.ts) + '</b> — ' + (last.ok.length ? 'فـ: ' + last.ok.join(' + ') : '❌ ما تحفظش (عطي إذن التخزين للتطبيق)') : 'الحفظ التلقائي كيدير نسخة فـ Documents و Download بعد كل تعديل (من بعد 3 ثواني).';
}
async function bkPerm(force) {
  const FS = CP().Filesystem; if (!FS) return false;
  try { const st = await FS.checkPermissions(); if (st.publicStorage === 'granted') return true; if (bkAsked && !force) return false; bkAsked = true; const r = await FS.requestPermissions(); return r.publicStorage === 'granted'; } catch (e) { return false; }
}
async function doBackup(manual) {
  const FS = CP().Filesystem; if (!FS || isEmptyData()) return null;
  await bkPerm(manual === true);
  const day = dayKey(), data = JSON.stringify(Object.assign({}, S, { _savedAt: Date.now() })), ok = [];
  for (const [dir, path, label] of BK_TARGETS) {
    try {
      await FS.writeFile({ path: path + '/drogueri-latest.json', data, directory: dir, encoding: 'utf8', recursive: true });
      await FS.writeFile({ path: path + '/backup-' + day + '.json', data, directory: dir, encoding: 'utf8', recursive: true });
      ok.push(label);
      try {
        const r = await FS.readdir({ path, directory: dir });
        const fs = (r.files || []).map(f => f.name || f).filter(n => /^backup-\d{4}-\d{2}-\d{2}\.json$/.test(n)).sort();
        for (const n of fs.slice(0, Math.max(0, fs.length - 30))) await FS.deleteFile({ path: path + '/' + n, directory: dir });
      } catch (e) {}
    } catch (e) {}
  }
  try { localStorage.setItem('drog_bk', JSON.stringify({ ts: Date.now(), ok })); } catch (e) {}
  const el = document.getElementById('bkst'); if (el) el.innerHTML = bkStatus();
  if (manual === true) toast(ok.length ? '✅ تحفظات النسخة فـ: ' + ok.join(' + ') : '❌ ما قدرتش نحفظ. عطي إذن التخزين للتطبيق');
  return ok;
}
async function readLatestBackup() {
  const FS = CP().Filesystem; if (!FS) return null; let best = null;
  for (const [dir, path] of BK_TARGETS) {
    try {
      const r = await FS.readFile({ path: path + '/drogueri-latest.json', directory: dir, encoding: 'utf8' });
      const d = JSON.parse(typeof r.data === 'string' ? r.data : await r.data.text());
      if (d && d.products && d.custs && (!best || (d._savedAt || 0) > (best._savedAt || 0))) best = d;
    } catch (e) {}
  }
  return best;
}
function applyBackup(d) { localStorage.setItem(KEY, JSON.stringify(d)); S = load(); render(); checkAlerts(); }
async function autoRestore() {
  if (!isEmptyData()) return;
  await bkPerm(false);
  const b = await readLatestBackup(); if (!b) return;
  applyBackup(b); toast('♻️ رجعت البيانات تلقائيا من آخر نسخة (' + fd(b._savedAt || Date.now()) + ')');
}
async function restoreFromPhone() {
  await bkPerm(true);
  const b = await readLatestBackup();
  if (!b) return toast('ما لقيت حتى نسخة فالهاتف. استعمل "استرجاع من ملف JSON"');
  ask('لقيت نسخة من ' + fd(b._savedAt || Date.now()) + ' (' + b.products.length + ' سلعة، ' + b.custs.length + ' زبون). نرجعها؟ البيانات الحالية غادي تتعوض.', () => applyBackup(b), 'استرجاع');
}
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const n2 = v => Math.round((+v || 0) * 100) / 100;
const fmt = v => n2(v).toLocaleString('en-US', { maximumFractionDigits: 2 }) + ' DH';
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const DAYS = ['الأحد', 'الاثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];
const p2 = n => String(n).padStart(2, '0');
const fd = ts => { const d = new Date(ts); return DAYS[d.getDay()] + ' ' + p2(d.getDate()) + '/' + p2(d.getMonth() + 1) + '/' + d.getFullYear() + ' • ' + p2(d.getHours()) + ':' + p2(d.getMinutes()); };
const dayKey = (t) => { const d = new Date(t || Date.now()); return d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate()); };
const prod = id => S.products.find(p => p.id === id);
const cust = id => S.custs.find(c => c.id === id);
const rem = c => n2(c.ledger.reduce((a, l) => a + (l.t === 'debt' ? l.amt : -l.amt), 0));
const totalDebt = () => S.custs.reduce((a, c) => a + Math.max(0, rem(c)), 0);
function debtSince(c) { const q = []; [...c.ledger].sort((a, b) => a.ts - b.ts).forEach(l => { if (l.t === 'debt') q.push({ ts: l.ts, a: l.amt }); else { let x = l.amt; while (x > 0 && q.length) { if (q[0].a <= x) { x = n2(x - q[0].a); q.shift(); } else { q[0].a = n2(q[0].a - x); x = 0; } } } }); return q.length ? q[0].ts : 0; }
const LATE_MS = 60 * 864e5;
const isLate = c => rem(c) > 0 && debtSince(c) && Date.now() - debtSince(c) >= LATE_MS;
const lateCusts = () => S.custs.filter(isLate).sort((a, b) => debtSince(a) - debtSince(b));
function debtCard() {
  const L = lateCusts(), sum = n2(L.reduce((a, c) => a + rem(c), 0));
  return `<div class="card"><div class="grid2"><div class="stat"><small>📒 مجموع الديون</small><b class="red">${fmt(totalDebt())}</b></div><div class="stat"><small>😡 متأخرين أكثر من شهرين</small><b class="red">${L.length}${L.length ? ' • ' + fmt(sum) : ''}</b></div></div>
  ${L.map(c => `<div class="alert r" style="margin-top:8px" onclick="openCust('${c.id}')"><div><b>😡 ${esc(c.name)}</b><small>${lateTxt(debtSince(c))}</small></div><span class="badge red">${fmt(rem(c))}</span></div>`).join('')}</div>`;
}
function lateTxt(ts) { if (!ts) return ''; const days = Math.floor((Date.now() - ts) / 864e5); if (days < 1) return ''; const m = Math.floor(days / 30), d = days % 30; let s = m === 1 ? 'شهر' : m === 2 ? 'شهرين' : m >= 3 ? m + ' أشهر' : ''; if (d) s += (s ? ' و' : '') + d + ' يوم'; return '⏳ الكريدي من ' + s + ' (متأخر)'; }
function toast(m) { const t = $('#toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(toast.h); toast.h = setTimeout(() => t.style.display = 'none', 2600); }

/* ============ التنبيهات ============ */
function effDay(c) { const d = new Date(); const last = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate(); return Math.min(c.dueDay || 1, last); }
function isDue(c) { return rem(c) > 0 && new Date().getDate() >= effDay(c); }
function alerts() {
  const stock = S.products.filter(p => p.qty <= Math.max(p.min || 0, 1)).sort((a, b) => a.qty - b.qty);
  const exp = S.products.filter(p => p.exp).map(p => ({ p, d: Math.ceil((new Date(p.exp + 'T23:59:59') - new Date()) / 864e5) })).filter(x => x.d <= 30).sort((a, b) => a.d - b.d);
  const due = S.custs.filter(isDue).sort((a, b) => rem(b) - rem(a));
  return { stock, exp, due };
}
const CP = () => (window.Capacitor && window.Capacitor.Plugins) || {};
function speak(t) {
  if (S.shop.voice === 0) return;
  try { const T = CP().TextToSpeech; if (T) { T.speak({ text: String(t), lang: 'ar-SA', rate: 0.95, volume: 1 }).catch(() => {}); return; } } catch (e) {}
  try { if (!window.speechSynthesis) return; const u = new SpeechSynthesisUtterance(t); u.lang = 'ar-SA'; u.rate = 0.95; speechSynthesis.cancel(); speechSynthesis.speak(u); } catch (e) {}
}
async function notify(title, body, tag) {
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  try {
    const reg = 'serviceWorker' in navigator ? await navigator.serviceWorker.getRegistration() : null;
    const o = { body, tag, icon: 'icon-192.png', badge: 'icon-192.png', dir: 'rtl', lang: 'ar', vibrate: [200, 100, 200] };

function startVoice(tid) {

        const pm = await NR.requestPermissions(); if (pm.speechRecognition && pm.speechRecognition !== 'granted') return toast('خاصك تعطي إذن الميكروفون للتطبيق');

        const t = r && r.matches && r.matches[0]; if (t) fill(t);

    })();
    return;
  }

    r.start(); toast('🎤 هضر دابا...');

}

/* ============ البيع ============ */
function sellProd(id) { closeSheet(); tab = 'sell'; render(); addCart(id); }
function sellView() {
  return `<div class="rowf"><input id="sq" type="search" placeholder="🔎 قلب على السلعة (بالكتابة أو بالصوت)..." oninput="sellSearch(this.value)" autocomplete="off" style="flex:1"><button class="micbtn" onclick="startVoice('sq')" aria-label="بحث صوتي">🎤</button></div>

}
function sellSearch(q) {
  q = q.trim().toLowerCase(); const el = $('#sres');
  if (!q) { el.innerHTML = ''; return; }
  const L = S.products.filter(p => (p.name + ' ' + (p.cat || '')).toLowerCase().includes(q)).slice(0, 8);
  el.innerHTML = L.length ? L.map(p => `<div class="item" onclick="addCart('${p.id}')"><div><b>${esc(p.name)}</b><small>${fmt(p.sell)}</small></div><span class="badge ${stockCls(p)}">${n2(p.qty)} ${esc(p.unit)}</span></div>`).join('') : '<div class="empty">ما كاين هاد السلعة. زيدها من تبويب السلع.</div>';
}
function addCart(id) {
  const p = prod(id); if (!p) return;
  const l = cart.find(x => x.pid === id); if (l) l.qty = n2(l.qty + 1); else cart.push({ pid: id, qty: 1, price: p.sell });

}
const cartTotal = () => n2(cart.reduce((a, l) => a + l.qty * l.price, 0));
function renderCart() { const el = $('#cartBox'); if (!el) return; el.innerHTML = cartHtml(); recalc(); }
function cartHtml() {
  if (!cart.length) return '<div class="empty">السلة خاوية. قلب على سلعة من فوق.</div>';
  const rows = cart.map((l, i) => { const p = prod(l.pid); return `<div class="line"><div><b>${esc(p.name)}</b><small>بقى ${n2(p.qty)} ${esc(p.unit)}${p.nego ? ' • تفاوض حتى ' + fmt(p.nego) : ''}</small></div>
  <div class="qty"><button onclick="cq(${i},-1)">−</button><input type="number" inputmode="decimal" step="any" value="${l.qty}" oninput="cs(${i},'qty',this.value)"><button onclick="cq(${i},1)">+</button></div>
  <input class="pr" type="number" inputmode="decimal" step="any" value="${l.price}" oninput="cs(${i},'price',this.value)" aria-label="الثمن"><button class="x" onclick="cd(${i})" aria-label="حيد">✕</button></div>`; }).join('');
  return rows + `<div class="tot"><span>المجموع</span><b id="tot"></b></div>
  <label>شحال خلص الزبون؟ (خليه خاوي إلا خلص كلشي)</label><input id="paid" type="number" inputmode="decimal" step="any" value="${esc(paidIn)}" oninput="paidIn=this.value;recalc()">
  <div id="remBox"></div>
  <label>الزبون (ضروري إلا بقى شي كريدي)</label>
  <div class="rowf"><select id="scust" onchange="sellCust=this.value"><option value="">— بدون زبون —</option>${S.custs.map(c => `<option value="${c.id}" ${c.id === sellCust ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}</select><button class="btn sm sec" onclick="custForm(null,true)">➕ جديد</button></div>
  <button class="btn big y" onclick="checkout()">✅ تسجيل البيع</button>`;
}
function cq(i, d) { cart[i].qty = Math.max(0, n2(cart[i].qty + d)); renderCart(); }
function cs(i, k, v) { cart[i][k] = +v || 0; recalc(); }
function cd(i) { cart.splice(i, 1); renderCart(); }
function recalc() {
  const t = $('#tot'); if (!t) return; const total = cartTotal(); t.textContent = fmt(total);
  const paid = paidIn === '' ? total : +paidIn || 0; const r = n2(total - paid);
  $('#remBox').innerHTML = r > 0 ? `<div class="note">الباقي كريدي على الزبون: <b class="red">${fmt(r)}</b></div>` : '';
  $('#paid').placeholder = n2(total);
}
function checkout() {
  cart = cart.filter(l => l.qty > 0); if (!cart.length) return toast('السلة خاوية');
  const total = cartTotal(); let paid = paidIn === '' ? total : n2(paidIn); if (paid > total) paid = total; if (paid < 0) paid = 0;
  const r = n2(total - paid), cid = sellCust || '';
  if (r > 0 && !cid) return toast('اختار الزبون باش نسجلو الكريدي');
  for (const l of cart) { const p = prod(l.pid); if (p.qty < l.qty && !confirm('في المخزن ' + n2(p.qty) + ' ' + p.unit + ' فقط من "' + p.name + '". نكمل؟')) return; }
  const ts = Date.now(), lines = cart.map(l => { const p = prod(l.pid); p.qty = n2(p.qty - l.qty); return { pid: p.id, name: p.name, qty: l.qty, price: l.price, buy: p.buy || 0, nego: l.price < p.sell ? 1 : 0 }; });
  S.sales.push({ id: uid(), ts, lines, total, paid, cid: r > 0 ? cid : '' });
  if (r > 0) cust(cid).ledger.push({ id: uid(), t: 'debt', amt: r, note: 'مشتريات: ' + lines.map(l => l.name + ' ×' + l.qty).join('، '), items: lines.map(l => ({ n: l.name, a: n2(l.price * l.qty), q: l.qty })), ts });
  save(); cart = []; paidIn = ''; sellCust = ''; toast('تسجل البيع ✅ ' + fmt(total)); speak('تسجل البيع. المجموع ' + fmt(total)); render(); checkAlerts();
}

/* ============ الديون ============ */

function debtList() {
  const q = Q.debt.trim().toLowerCase();
  const L = S.custs.filter(c => (!q || c.name.toLowerCase().includes(q)) && (debtF === 'all' || (debtF === 'owe' ? rem(c) > 0 : rem(c) <= 0)))
    .sort((a, b) => (isDue(b) - isDue(a)) || (rem(b) - rem(a)));
  if (!L.length) return '<div class="empty">' + (S.custs.length ? 'ما لقينا والو.' : 'ما زال ما كاين حتى زبون. ضغط على + باش تزيد.') + '</div>';
  return L.map(c => { const r = rem(c), lt = r > 0 ? lateTxt(debtSince(c)) : ''; return `<div class="item" onclick="openCust('${c.id}')"><div><b>${isLate(c) ? '😡 ' : ''}${esc(c.name)}</b><small>${lt ? lt + ' • ' : ''}${r > 0 ? (isDue(c) ? '⚠️ الشهر خلص، خاصو يخلص' : 'التذكير: يوم ' + c.dueDay + ' من كل شهر') : 'خالص ✅'}</small></div><span class="badge ${r > 0 ? 'red' : 'grn'}">${r > 0 ? fmt(r) : '0 DH'}</span></div>`; }).join('');
}
function custItems(c) {

  c.ledger.filter(l => l.t === 'debt').sort((a, b) => a.ts - b.ts).forEach(l => ledItems(l).forEach(x => items.push({ n: x.n, a: x.a, q: x.q || 1, ts: l.ts })));
  c.ledger.filter(l => l.t === 'ret').forEach(l => { const nm = String(l.note).replace(/\s*×[\d.]+$/, '').trim().toLowerCase(); const i = items.findIndex(x => x.n.trim().toLowerCase() === nm); if (i > -1) items.splice(i, 1); });
  return items;
}
function retFor(id, el) { retForm(id, { n: el.dataset.n, a: +el.dataset.a, q: +el.dataset.q }); }
function openCust(id) {

  sheet(`<h3>${esc(c.name)}</h3><small style="color:var(--mut);direction:ltr;display:block;text-align:right">${esc(c.phone || '')}</small>

  <div class="btns"><button class="btn grnb" onclick="payForm('${id}')">💵 خلص</button><button class="btn y" onclick="debtForm('${id}')">➕ دين جديد</button>
  <button class="btn sec" style="color:var(--org)" onclick="retForm('${id}')">↩️ رجّع سلعة ❗</button>
  <button class="btn sec" onclick="receiptWa('${id}')">🧾 وصل (واتساب)</button>
  <button class="btn sec" onclick="remindWa('${id}')">💬 ذكّرو</button>${c.phone ? `<a class="btn sec" style="text-align:center;text-decoration:none" href="tel:${esc(c.phone)}">📞 اتصل</a>` : '<span></span>'}
  <button class="btn sec" onclick="custForm('${id}')">✏️ تعديل</button><button class="btn sec" style="color:var(--red)" onclick="delCust('${id}')">🗑 مسح</button></div>
  ${its.length ? '<h2>🛒 السلع عند الزبون</h2>' + its.map(x => `<div class="hist"><div><b>${esc(x.n)}${x.q > 1 ? ' ×' + x.q : ''}</b><small>${fd(x.ts)}</small></div><div style="display:flex;gap:8px;align-items:center"><b>${fmt(x.a)}</b><button class="btn sm sec" data-n="${esc(x.n)}" data-a="${x.a}" data-q="${x.q}" onclick="retFor('${id}',this)">↩️ رجّع</button></div></div>`).join('') : ''}
  <h2>السجل</h2>${rows.map(({ l, run }) => `<div class="hist"><div>${ledLbl(l)} <b class="${ledCls(l)}">${fmt(l.amt)}</b><small>${esc(l.note || '')}</small>${l.stock ? '<small>📦 رجعت للمخزن</small>' : ''}<small>الباقي بعدها: ${fmt(run)}</small></div><small>${fd(l.ts)}</small></div>`).join('') || '<div class="empty">ما كاين حتى حركة.</div>'}
  <button class="btn sec big" onclick="closeSheet()">إغلاق</button>`);
}
function custForm(id, fromSell) {

function saveCust(id, fromSell) {

function dLine(k) { return `<div class="line" style="grid-template-columns:1fr 96px 30px"><input id="dn-${k}" placeholder="اسم السلعة" list="pl" oninput="dPick(${k});dRecalc()"><input id="dp-${k}" type="number" inputmode="decimal" step="any" placeholder="الثمن" oninput="dRecalc()"><button class="x" onclick="this.parentNode.remove();dRecalc()">✕</button></div>`; }
function dPick(k) {

function dRecalc() { let s = 0; document.querySelectorAll('[id^="dp-"]').forEach(e => s += +e.value || 0); const el = $('#dsum'); if (el) el.textContent = fmt(n2(s)); }
function debtForm(id) {

  sheet(`<h3>دين جديد: ${esc(c.name)}</h3><div class="note">الباقي دابا: ${fmt(rem(c))} — كتب السلع اللي خدا والثمن ديال كل وحدة، والمجموع كيتحسب بوحدو</div>

  <button class="btn sm sec" style="margin:8px 0" onclick="$('#dlines').insertAdjacentHTML('beforeend', dLine(Date.now()))">➕ زيد سلعة أخرى</button>
  <div class="tot"><span>المجموع</span><b id="dsum">0 DH</b></div>

function doDebt(id) {
  const items = [], hit = [], objs = [];
  let a = 0;
  document.querySelectorAll('[id^="dn-"]').forEach(n => {
    const p = $('#dp-' + n.id.slice(3));
    if (n.value.trim() || (p && +p.value > 0)) { a += +(p && p.value) || 0; items.push(n.value.trim() + ' (' + fmt(+(p && p.value) || 0) + ')'); const pm = S.products.find(x => x.name.trim().toLowerCase() === n.value.trim().toLowerCase()); if (pm) hit.push(pm); objs.push({ n: n.value.trim() || 'سلعة', a: n2(+(p && p.value) || 0), q: 1 }); }
  });
  a = n2(a); if (a <= 0) return toast('زيد سلعة واحدة على الأقل بالثمن ديالها');
  cust(id).ledger.push({ id: uid(), t: 'debt', amt: a, note: items.join('، '), items: objs, ts: Date.now() });
  hit.forEach(pm => { pm.qty = Math.max(0, n2(pm.qty - 1)); S.moves.push({ id: uid(), pid: pm.id, type: 'out', qty: 1, cid: id, ts: Date.now() }); });
  save(); toast('تسجل الدين: ' + fmt(a) + ' — الباقي: ' + fmt(rem(cust(id)))); speak('تسجل دين ' + fmt(a)); openCust(id); render(); checkAlerts();
}
function payForm(id) {
  const c = cust(id), r = rem(c);

}

  <div class="btns"><button class="btn grnb" onclick="doBackup(true)">💾 احفظ دابا</button><button class="btn" onclick="shareBackup()">📤 صيفط الملف (واتساب / بلوتوث / Wi-Fi)</button><button class="btn sec" onclick="saveToDownload()">⬇️ نزّل فـ Download</button><button class="btn sec" onclick="restoreFromPhone()">♻️ استرجع آخر نسخة من الهاتف</button></div>
  <button class="btn sec big" onclick="$('#imp').click()">⬆️ استرجاع من ملف JSON</button>
  <input id="imp" type="file" accept="application/json,.json" style="display:none" onchange="importData(this.files[0])">
  ${installEv ? '<button class="btn y big" onclick="installEv.prompt()">📲 تثبيت التطبيق على الهاتف</button>' : ''}
  <button class="btn sec big" style="color:var(--red)" onclick="wipe()">🗑 مسح كلشي</button></div>`;
}
/* ============ الجيميل (Firebase) ============ */
let fbReady = null;
const FB_CONFIG = {
  apiKey: "حط_API_KEY_هنا",
  authDomain: "مشروعك.firebaseapp.com",
  projectId: "مشروعك",
  storageBucket: "مشروعك.appspot.com",
  messagingSenderId: "000000000000",
  appId: "1:000000000000:web:xxxxxxxx"
};
function loadScript(su) { return new Promise((res, rej) => { const s = document.createElement('script'); s.src = su; s.onload = res; s.onerror = rej; document.head.appendChild(s); }); }
async function gSignIn() {
  if (S.shop.gmail) return toast('نتا مسجل دابا بـ ' + S.shop.gmail);
  if (!navigator.onLine) return toast('خاص الإنترنت باش تسجل بالجيميل');
  if (FB_CONFIG.apiKey.indexOf('هنا') > -1) return toast('خاصك تدخل إعدادات Firebase فالكود أولاً (شرح فالملف README)');
  try {
    toast('كيتصل بالجيميل...');
    if (!(await fbInit())) return toast('تعذر الاتصال');
    localStorage.setItem('drog_gpending', '1');
    await firebase.auth().signInWithRedirect(new firebase.auth.GoogleAuthProvider());
  } catch (e) { toast('ما تسجلش: ' + (e.code || 'غلط فالاتصال')); }
}
function gSignOut() { ask('تخرج من الجيميل؟ (المعلومات كتبقى محفوظة فالسحابة وكترجع ملي تدخل بنفس الجيميل)', async () => { await cloudPush(true); try { if (fbReady) await firebase.auth().signOut(); } catch (e) {} S.shop.gmail = ''; localStorage.setItem(KEY, JSON.stringify(S)); render(); toast('خرجتي من الجيميل'); }, 'خروج'); }

/* ============ المزامنة السحابية (Firestore) ============ */
const fbOK = () => FB_CONFIG.apiKey.indexOf('هنا') === -1;
async function fbInit() {
  if (fbReady) return true;
  if (!navigator.onLine || !fbOK()) return false;
  const B = 'https://www.gstatic.com/firebasejs/10.12.2/';
  await loadScript(B + 'firebase-app-compat.js'); await loadScript(B + 'firebase-auth-compat.js'); await loadScript(B + 'firebase-firestore-compat.js');
  firebase.initializeApp(FB_CONFIG); fbReady = 1; return true;
}
const fbUser = () => new Promise(r => { const u = firebase.auth().onAuthStateChanged(x => { u(); r(x); }); });
const cloudDoc = em => firebase.firestore().collection('users').doc(String(em).toLowerCase());
let cloudTimer = null, cloudBusy = false;
function cloudSoon() { if (!S.shop || !S.shop.gmail) return; clearTimeout(cloudTimer); cloudTimer = setTimeout(() => cloudPush(), 5000); }
function cloudStatus(t) { try { localStorage.setItem('drog_cl', t); } catch (e) {} const el = $('#clst'); if (el) el.innerHTML = t; }
async function cloudPush(manual) {
  if (!S.shop.gmail || isEmptyData() || cloudBusy) { if (manual === true && isEmptyData()) toast('ما كاين والو باش يتبعث'); return false; }
  if (!navigator.onLine) { if (manual === true) toast('خاص الإنترنت'); return false; }
  cloudBusy = true;
  try {
    if (!(await fbInit())) return false;
    const u = await fbUser();
    if (!u || (u.email || '').toLowerCase() !== S.shop.gmail.toLowerCase()) { cloudStatus('⚠️ عاود سجل الدخول بالجيميل'); return false; }
    await cloudDoc(S.shop.gmail).set({ data: JSON.stringify(Object.assign({}, S, { _savedAt: Date.now() })), ts: Date.now() });
    cloudStatus('☁️ آخر مزامنة: <b>' + fd(Date.now()) + '</b>'); if (manual === true) toast('✅ تبعثات المعلومات للسحابة');
    return true;
  } catch (e) { cloudStatus('❌ فشلات المزامنة (' + (e.code || 'خطأ') + ')'); if (manual === true) toast('❌ فشلات المزامنة'); return false; }
  finally { cloudBusy = false; }
}
async function cloudRestore(auto) {
  if (!S.shop.gmail) return;
  try {
    if (!(await fbInit())) return toast('خاص الإنترنت');
    const u = await fbUser(); if (!u) return toast('عاود سجل الدخول بالجيميل');
    const snap = await cloudDoc(S.shop.gmail).get();
    if (!snap.exists) { if (!auto) toast('ما كاين حتى نسخة فالسحابة'); return cloudPush(); }
    const d = JSON.parse(snap.data().data); if (!d || !d.products || !d.custs) return;
    const em = S.shop.gmail, go = () => { d.shop = d.shop || {}; d.shop.gmail = em; applyBackup(d); cloudStatus('☁️ تسترجعات من السحابة: <b>' + fd(Date.now()) + '</b>'); toast('♻️ رجعات المعلومات من الجيميل ✅'); };
    if (auto && isEmptyData()) go();
    else ask('لقيت نسخة فالسحابة من ' + fd(d._savedAt || snap.data().ts) + ' (' + d.products.length + ' سلعة، ' + d.custs.length + ' زبون). نرجعها؟ البيانات الحالية غادي تتعوض.', go, 'استرجاع من السحابة');
  } catch (e) { toast('❌ ما قدرتش نسترجع (' + (e.code || 'خطأ') + ')'); }
}
async function cloudInit() {
  const pend = localStorage.getItem('drog_gpending');
  if (!S.shop.gmail && !pend) return;
  try {
    if (!(await fbInit())) return;
    if (pend) {
      localStorage.removeItem('drog_gpending');
      const rd = await firebase.auth().getRedirectResult();
      if (rd && rd.user) { S.shop.gmail = rd.user.email; localStorage.setItem(KEY, JSON.stringify(S)); toast('تسجلتي ✅ ' + S.shop.gmail); render(); await cloudRestore(isEmptyData()); return; }
    }
    if (S.shop.gmail) { if (isEmptyData()) await cloudRestore(true); else cloudPush(); }
  } catch (e) {}
}

async function askNotif() {
  if (!('Notification' in window)) return toast('المتصفح ما كيدعمش الإشعارات');
  const r = await Notification.requestPermission(); toast(r === 'granted' ? 'الإشعارات تفعلات ✅' : 'ما تفعلاتش'); render(); if (r === 'granted') { S.notified = {}; checkAlerts(); }
}
async function shareBackup() {
  const name = 'drogueri-backup-' + dayKey() + '.json', data = JSON.stringify(Object.assign({}, S, { _savedAt: Date.now() }));
  const FS = CP().Filesystem, SH = CP().Share;
  if (FS && SH) {
    try {
      await FS.writeFile({ path: name, data, directory: 'CACHE', encoding: 'utf8' });
      const u = await FS.getUri({ path: name, directory: 'CACHE' });
      await SH.share({ title: 'نسخة احتياطية - دروݣري', text: 'ملف النسخة الاحتياطية ' + dayKey(), files: [u.uri], dialogTitle: 'صيفط الملف (واتساب، بلوتوث، Wi-Fi...)' });
      return;
    } catch (e) { if (/cancel/i.test(String((e && e.message) || e))) return; }
  }
  try {
    const f = new File([new Blob([data], { type: 'application/json' })], name, { type: 'application/json' });
    if (navigator.canShare && navigator.canShare({ files: [f] })) { await navigator.share({ files: [f], title: 'نسخة احتياطية - دروݣري' }); return; }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  exportData();
}
async function saveToDownload() {
  const FS = CP().Filesystem, name = 'drogueri-backup-' + dayKey() + '.json';
  if (FS) {
    await bkPerm(true);
    try { await FS.writeFile({ path: 'Download/' + name, data: JSON.stringify(Object.assign({}, S, { _savedAt: Date.now() })), directory: 'EXTERNAL_STORAGE', encoding: 'utf8', recursive: true }); return toast('✅ تحفظ فـ Download: ' + name); } catch (e) {}
  }
  exportData();
}
function autoBackup() { setTimeout(() => { doBackup(); }, 4000); }
function exportData() {
  const b = new Blob([JSON.stringify(S)], { type: 'application/json' }), a = document.createElement('a');
  a.href = URL.createObjectURL(b); a.download = 'drogueri-backup-' + dayKey() + '.json'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  toast('تحملات النسخة الاحتياطية ✅');
}
function importData(f) {
  if (!f) return; const r = new FileReader();
  r.onload = () => { try { const d = JSON.parse(r.result); if (!d.products || !d.custs) throw 0; ask('هادشي غيعوض البيانات الحالية. نكمل؟', () => { localStorage.setItem(KEY, JSON.stringify(d)); S = load(); toast('تسترجعات البيانات ✅'); render(); checkAlerts(); }, 'استرجاع'); } catch (e) { toast('الملف ماشي صحيح'); } };
  r.readAsText(f);
}
function wipe() { ask('تمسح كلشي (السلع، الزبناء، المبيعات)؟ ما كاينش رجوع.', () => { localStorage.removeItem(KEY); S = load(); cart = []; render(); toast('تمسح كلشي'); }, 'مسح كلشي'); }

/* ============ التشغيل ============ */
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
if (!localStorage.getItem('drog_act')) showLock();
render(); checkAlerts(); autoRestore().then(autoBackup).then(cloudInit);
setInterval(checkAlerts, 60000);
setInterval(checkGuard, 5000);
document.addEventListener('visibilitychange', () => { if (document.hidden) { hiddenAt = Date.now(); } else { checkGuard(); checkAlerts(); if (tab === 'home') render(); } });
</script>
